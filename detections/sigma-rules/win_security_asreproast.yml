title: Potential AS-REP Roasting Activity
id: 8c34f409-5d29-43c2-8495-2db08ecdb771
status: test
description: Detects Kerberos Ticket Granting Ticket (TGT) requests where Kerberos pre-authentication was disabled (PreAuthType 0), indicating potential AS-REP Roasting.
references:
  - https://attack.mitre.org/techniques/T1558/004/
author: Active Directory Lab Project (İlkin Fərəcov)
date: 2026/09/09
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4768
    PreAuthType: '0'
  filter_machine_accounts:
    TargetUserName|endswith: '$'
  condition: selection and not filter_machine_accounts
falsepositives:
  - Legacy enterprise applications explicitly configured with pre-authentication disabled
level: high
tags:
  - attack.credential_access
  - attack.t1558.004
