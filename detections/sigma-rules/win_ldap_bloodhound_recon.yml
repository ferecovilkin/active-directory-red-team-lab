title: Mass Active Directory LDAP Reconnaissance (BloodHound / SharpHound Pattern)
id: f491ba63-8a39-4ce4-81d3-6e3e57f20ea1
status: experimental
description: Detects extensive LDAP enumeration activity characterized by high volumes of directory search operations typically generated by automated graph collection engines.
references:
  - https://attack.mitre.org/techniques/T1087/002/
  - https://attack.mitre.org/techniques/T1069/002/
author: Active Directory Lab Project (İlkin Fərəcov)
date: 2026/09/09
logsource:
  product: windows
  service: directory-service
detection:
  selection:
    EventID: 1644
  condition: selection | count() by ClientIPAddress > 50
timeframe: 5m
falsepositives:
  - Enterprise vulnerability scanners or asset inventory discovery tools during scheduled scan windows
level: medium
tags:
  - attack.discovery
  - attack.t1087.002
  - attack.t1069.002
